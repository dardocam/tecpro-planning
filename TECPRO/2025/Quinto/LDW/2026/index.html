<!DOCTYPE html>
<html lang="c">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina web LDW</title>
    <style>
        /* Reset básico de márgenes y padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* Incluye padding y border en el ancho/alto total */
        }
        body{
            font-family: Arial, sans-serif;
            background-color: #2ce510;
        }

        /* Contenedor principal del header */
        .header {
            display: flex;              /* Activa flexbox */
            align-items: center;        /* Centra verticalmente los elementos */
            justify-content: space-between; /* Distribuye: logo izquierda, nav centro, botón derecha */

            padding: 15px 30px;         /* Box model: espacio interno */
            background-color: #ffffff;
            border-bottom: 2px solid #100f0f; /* Box model: borde inferior */
            height: 80px;               /* Box model: altura fija */
        }

                /* Logo */
        .logo {
        background-color: #2c3e50;
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
            padding: 5px 10px;          /* Espaciado interno del logo */
            border: 1px solid #2c3e50;  /* Borde decorativo */
            border-radius: 4px;         /* Esquina redondeada (opcional, sigue siendo box-model) */
        }

                /* Para pantallas pequeñas: colapsar elementos en columna */
        @media (max-width: 600px) {
            .header {
                flex-direction: column; /* Cambia a columna en móvil */
                height: auto;           /* Altura automática */
                padding: 15px;
                gap: 15px;              /* Espacio entre los tres bloques */
            }
            .nav {
                flex-wrap: wrap;        /* Permite que los enlaces salten de línea */
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">MiSitio</div>
        <nav class="nav">
            <a href="#">Inicio</a>
            <a href="#">Servicios</a>
            <a href="#">Portafolio</a>
            <a href="#">Contacto</a>
        </nav>
        <button class="btn">Registrarse</button>
    </header>
    
</body>
</html>
